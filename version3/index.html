<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fa" />
    <!-- Ground color before the stylesheet arrives, so neither theme flashes the other. -->
    <style>
      html { background: #f6f8fa; color-scheme: light; }
      html.dark { background: #0a1420; color-scheme: dark; }
    </style>
    <script>
      /* Paint the stored theme before first render so there is no flash of the
         wrong ground. Key and default must match src/hooks/useTheme.ts. */
      (function () {
        try {
          var stored = localStorage.getItem('lht-theme')
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a1420' : '#f6f8fa')
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
